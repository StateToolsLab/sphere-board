<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Sphere Board: three stage bands and boundary gates</title>
  <desc id="desc">A schematic adaptation of a fictional essay project. Concept is the inner disk, first draft is the middle band, and planned publication is the outer dashed band. Each stage has a diamond gate on its outer boundary. The concept gate is passed. The other two are pending and carry segmented current marks. A first-draft work bead has four ready ticks. Another work bead has a segmented current mark. A derived bead branches outward. All stages remain visible.</desc>
