    <text x="35" y="38" font-size="23" font-weight="700">Sphere Board: stage order from the center outward</text>
    <text x="35" y="63" font-size="14">Fictional essay example · schematic, not an exact screen rendering</text>
    <g stroke="#526271" stroke-width="1.5">
      <circle cx="310" cy="345" r="260" fill="#fafbfc" stroke-dasharray="6 5"/>
