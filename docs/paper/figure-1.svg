      <text x="665" y="457">Four arcs; pending gates use this mark too</text>
      <text x="665" y="500" font-weight="700">Present gate-defined reach</text>
      <text x="665" y="522">Through the second boundary in this example</text>
      <text x="665" y="544">Outer range depends on crossing its gate.</text>
