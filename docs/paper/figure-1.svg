      <text x="665" y="131" font-weight="700">Planned outer stage</text>
      <text x="665" y="153">Dashed boundary; still visible</text>
      <text x="665" y="184" font-weight="700">Derived work</text>
      <text x="665" y="206">Short outward branch from its parent</text>
      <text x="665" y="244" font-weight="700">Ready work</text>
      <text x="665" y="266">Four straight ticks = recorded ready</text>
      <text x="665" y="296">Stage bands contain work beads;</text>
      <text x="665" y="318">diamond gates sit on outer boundaries.</text>
      <text x="665" y="351" font-weight="700">Radius encodes stage order</text>
      <text x="665" y="373">It is not a time or completion scale.</text>
